name: Build KeyConnect (Windows EXE + Android APK)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Host (Rust Win32 EXE)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-host
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-host

      - name: Run Protocol & Crypto Unit Tests
        run: cargo test --verbose

      - name: Build Optimized Windows Release Binary
        run: cargo build --release

      - name: Stage Executable Artifact
        shell: pwsh
        run: |
          Copy-Item target/release/keyconnect-host.exe ../KeyConnect-Windows-x64.exe

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyConnect-Windows-x64
          path: KeyConnect-Windows-x64.exe

  build-android:
    name: Android App (Kotlin Compose APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Cross-Language Crypto & Wire Protocol Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Installable Release APK
        run: gradle assembleRelease --stacktrace

      - name: Stage APK Artifact
        run: cp app/build/outputs/apk/release/app-release.apk ../KeyConnect-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyConnect-Android-APK
          path: KeyConnect-Android.apk

  publish-github-release:
    name: Publish GitHub Release (on tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/KeyConnect-Windows-x64.exe
            release-assets/KeyConnect-Android.apk
          generate_release_notes: true
