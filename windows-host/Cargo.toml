[package]
name = "keyconnect-host"
version = "1.0.0"
edition = "2021"
description = "KeyConnect Windows Host — Ultra-low-latency multi-transport remote keyboard receiver (USB, Wi-Fi, Bluetooth)"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
    "process",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
eframe = { version = "0.29.1", default-features = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Devices_Bluetooth",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }
winreg = "0.52"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
