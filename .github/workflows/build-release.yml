name: Build KeyConnect (Windows EXE + Android APK)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Host (Rust Win32 EXE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows-host
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 Windows x64 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 libx11-dev libxkbcommon-dev libwayland-dev pkg-config

      - name: Install Stable Rust Toolchain (x86_64-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-host

      - name: Run Protocol & Crypto Unit Tests
        run: cargo test --verbose

      - name: Cross-Compile Optimized Windows x64 Release EXE
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Stage Executable Artifact
        run: |
          cp target/x86_64-pc-windows-gnu/release/keyconnect-host.exe ../KeyConnect-Windows-x64.exe

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyConnect-Windows-x64
          path: KeyConnect-Windows-x64.exe

  build-android:
    name: Android App (Kotlin Compose APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Cross-Language Crypto & Wire Protocol Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Installable Release APK
        run: gradle assembleRelease --stacktrace

      - name: Stage APK Artifact
        run: cp app/build/outputs/apk/release/app-release.apk ../KeyConnect-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyConnect-Android-APK
          path: KeyConnect-Android.apk

  publish-github-release:
    name: Publish GitHub Release (Windows EXE + Android APK)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release v1.0.0 to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "KeyConnect v1.0.0 — Android (.apk) & Windows (.exe)"
          body: |
            ### تحميل مباشر وجاهز للتثبيت — KeyConnect v1.0.0
            - 📱 **نسخة الهاتف (Android):** حمّل وثبّت الملف **`KeyConnect-Android.apk`**
            - 💻 **نسخة اللابتوب (Windows 10/11):** حمّل وشغّل الملف **`KeyConnect-Windows-x64.exe`** مباشرة
          files: |
            release-assets/KeyConnect-Windows-x64.exe
            release-assets/KeyConnect-Android.apk
